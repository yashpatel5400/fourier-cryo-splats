[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-cryo-splats"
version = "0.1.0"
description = "Conjugate-paired Fourier Gaussian splats for cryo-EM reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "mrcfile", "requests", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
