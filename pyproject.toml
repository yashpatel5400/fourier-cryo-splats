[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-cryo-splats"
version = "0.1.0"
description = "Conjugate-paired Fourier Gaussian splats for cryo-EM reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "mrcfile", "requests", "matplotlib"]

[project.optional-dependencies]
uncertainty = ["finufft>=2.5", "starfile", "cvxpy>=1.7", "pypdf", "beautifulsoup4"]
test = ["pytest", "cvxpy>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
